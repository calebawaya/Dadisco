    <path d="M95 173v82h60v-82l-30-20Z" fill="#060a10" stroke="url(#blue)" stroke-width="5"/>
    <rect x="113" y="191" width="10" height="12" fill="#28a9ff"/><rect x="129" y="191" width="10" height="12" fill="#28a9ff"/>
    <rect x="113" y="209" width="10" height="12" fill="#28a9ff"/><rect x="129" y="209" width="10" height="12" fill="#28a9ff"/>
