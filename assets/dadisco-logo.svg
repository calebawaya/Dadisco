<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Dadisco Enterprise logo</title>
  <desc id="desc">Blue and black square construction company logo with a stylized D, building and house.</desc>
  <defs>
