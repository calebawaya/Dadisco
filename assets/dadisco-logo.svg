    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17202a"/><stop offset="1" stop-color="#030507"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect x="25" y="25" width="450" height="450" rx="34" fill="#05080d" stroke="url(#blue)" stroke-width="18" filter="url(#shadow)"/>
  <g transform="translate(75 62)">
